<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Metricore.in — AI Tool Finder & Directory{% endblock %}</title>

    <!-- Early Theme Evaluator (Daylight 6am-6pm / Nightlight 6pm-6am) to prevent flash -->
    <script>
        (function() {
            const storedTheme = localStorage.getItem('metricore_theme');
            let isDay = false;
            if (storedTheme) {
                isDay = storedTheme === 'day';
            } else {
                // 6am (6) to 6pm (18) is considered daylight
                const hour = new Date().getHours();
                isDay = hour >= 6 && hour < 18;
            }
            if (isDay) {
                document.documentElement.classList.add('day-mode');
            } else {
                document.documentElement.classList.remove('day-mode');
            }
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX for Instant Dynamic Search & Swapping -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- Custom Style with Day/Night Mode -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">
    <!-- Three-Layer Header (Sticky Row 1 + Sticky Row 2 + Scroll-Aware Filter Row 3) -->
    {% include "components/site_header.html" %}

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 py-8 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 space-y-2">
            <p>© 2026 Metricore.in — AI Tool Finder & Benchmark Platform.</p>
            <p class="text-slate-600">Built with FastAPI, Jinja2 & Tailwind CSS. Continuous integration synced with GitHub.</p>
        </div>
    </footer>

    <!-- Theme Switcher Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggleBtn = document.getElementById("theme-toggle-btn");
            const sunIcon = document.getElementById("theme-sun-icon");
            const moonIcon = document.getElementById("theme-moon-icon");
            const themeLabel = document.getElementById("theme-label");

            function updateUI() {
                const isDay = document.documentElement.classList.contains("day-mode");
                if (isDay) {
                    sunIcon.classList.remove("hidden");
                    moonIcon.classList.add("hidden");
                    themeLabel.textContent = "Daylight";
                } else {
                    sunIcon.classList.add("hidden");
                    moonIcon.classList.remove("hidden");
                    themeLabel.textContent = "Nightlight";
                }
            }

            updateUI();

            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => {
                    const isCurrentlyDay = document.documentElement.classList.contains("day-mode");
                    if (isCurrentlyDay) {
                        document.documentElement.classList.remove("day-mode");
                        localStorage.setItem("metricore_theme", "night");
                    } else {
                        document.documentElement.classList.add("day-mode");
                        localStorage.setItem("metricore_theme", "day");
                    }
                    updateUI();
                    window.dispatchEvent(new Event("themeChanged"));
                });
            }
        });
    </script>
</body>
</html>
