<!-- 4 Cards Per Row Grid (5 Rows = 20 Cards per Page) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    {% for tool in tools %}
        {% include "components/tool_card.html" %}
    {% else %}
        <div class="col-span-full py-16 text-center rounded-2xl border border-dashed border-slate-800 bg-slate-900/30">
            <svg class="w-12 h-12 text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <h4 class="text-base font-semibold text-slate-300">No matching AI tools found</h4>
            <p class="text-xs text-slate-500 mt-1">Try clearing your search query or selecting a different category.</p>
        </div>
    {% endfor %}
</div>

<!-- Benchmark-grade Pagination Bar at bottom of Grid -->
{% include "components/pagination.html" %}
