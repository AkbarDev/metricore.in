<div class="group relative rounded-2xl border border-slate-800/80 bg-slate-900/60 p-5 hover:border-purple-500/50 hover:bg-slate-900/90 transition-all duration-300 flex flex-col justify-between shadow-lg hover:shadow-purple-500/10 hover:-translate-y-0.5">
    <div>
        <!-- Card Top Badges -->
        <div class="flex items-center justify-between gap-2 mb-3">
            <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-1 rounded-md bg-slate-800 text-purple-300 border border-slate-700/60">
                {{ tool.category }}
            </span>
            {% if tool.pricing_type == "Paid" %}
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                    Paid ({{ tool.price_display }})
                </span>
            {% else %}
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    Free / Alt
                </span>
            {% endif %}
        </div>

        <!-- Tool Name -->
        <h3 class="text-lg font-bold text-white group-hover:text-purple-300 transition-colors flex items-center justify-between">
            <a href="/tool/{{ tool.id }}" class="hover:underline">
                {{ tool.name }}
            </a>
            <a href="{{ tool.url }}" target="_blank" rel="noopener noreferrer" class="text-slate-500 hover:text-white transition-colors p-1" title="Visit website">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
        </h3>

        <!-- Description -->
        <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">
            {{ tool.description }}
        </p>

        <!-- Free Tier Limit Box (Key Requirement) -->
        <div class="mt-4 p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/80">
            <div class="text-[10px] uppercase font-bold tracking-wider text-purple-400 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Free Tier Option to Test
            </div>
            <p class="text-xs text-slate-200 font-medium mt-1">
                {{ tool.free_tier_limit }}
            </p>
            <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-2">
                {{ tool.free_tier_details }}
            </p>
        </div>
    </div>

    <!-- Actions -->
    <div class="mt-5 pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs">
        <a href="/tool/{{ tool.id }}" class="text-purple-400 hover:text-purple-300 font-semibold flex items-center gap-1">
            View Details
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
        <a href="{{ tool.url }}" target="_blank" rel="noopener noreferrer" class="px-3 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-medium transition-all shadow-md shadow-purple-600/20">
            Try Free
        </a>
    </div>
</div>
