{% extends "base.html" %}

{% block title %}Sign In — Metricore.in{% endblock %}

{% block content %}
<div class="relative w-full min-h-[calc(100vh-8rem)] flex items-center justify-center p-4 sm:p-6 overflow-hidden bg-slate-950 select-none">

    <!-- Ambient Breathing Aura -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[750px] h-[750px] bg-purple-600/15 rounded-full blur-[160px] pointer-events-none animate-breathe"></div>
    <div class="absolute top-10 left-10 w-[450px] h-[450px] bg-cyan-600/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[450px] h-[450px] bg-pink-600/10 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- DYNAMIC INTERACTIVE CIRCULAR NETWORK CANVAS (Covers & Circles the Area) -->
    <canvas id="neural-network-canvas" class="absolute inset-0 w-full h-full pointer-events-auto z-0 opacity-90"></canvas>

    <!-- UN-ENCLOSED SIGN IN CONTAINER (Sits Organically Inside the Dynamic Network Circle) -->
    <div id="node-signin" class="relative z-20 w-full max-w-sm p-4 sm:p-6">

        {% if is_authenticated %}
            <!-- Authenticated State -->
            <div class="text-center py-6 space-y-4">
                <div class="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/20 backdrop-blur-md">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black text-white drop-shadow-md">Signed In as Akbar</h3>
                    <p class="text-xs text-slate-400 mt-1">AI Core ecosystem is unlocked.</p>
                </div>
                <div class="pt-2 flex flex-col gap-2.5">
                    <a href="/" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white text-xs font-bold uppercase tracking-wider shadow-xl shadow-purple-600/30 transition-all text-center block">
                        Enter Dashboard →
                    </a>
                    <a href="/logout" class="w-full py-2.5 rounded-2xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 text-xs font-medium text-center block border border-slate-800 backdrop-blur-md">
                        Sign Out
                    </a>
                </div>
            </div>
        {% else %}
            <!-- Seamless Sign In Form directly inside the constellation ring -->
            <form method="POST" action="/login" class="space-y-4">
                {% if error %}
                    <div class="p-3 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2 backdrop-blur-md">
                        <svg class="w-4 h-4 text-rose-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5 drop-shadow">
                        Admin Username
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            value="{{ entered_username or default_user }}" 
                            required 
                            autocomplete="username"
                            placeholder="Username (Akbar)"
                            class="w-full px-4 py-3 rounded-2xl bg-slate-950/80 border border-slate-800/90 text-white text-xs focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 backdrop-blur-xl transition-all font-medium shadow-lg"
                        >
                        <span class="absolute right-3.5 top-3.5 text-[9px] text-purple-400 font-mono font-bold">ADMIN</span>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5 drop-shadow">
                        Admin Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        value="REDACTED"
                        required 
                        autocomplete="current-password"
                        placeholder="Password (unlock)"
                        class="w-full px-4 py-3 rounded-2xl bg-slate-950/80 border border-slate-800/90 text-white text-xs focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 backdrop-blur-xl transition-all font-medium shadow-lg"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-600 via-purple-600 to-pink-600 hover:from-cyan-500 hover:via-purple-500 hover:to-pink-500 text-white text-xs font-bold uppercase tracking-wider shadow-xl shadow-purple-600/30 transition-all flex items-center justify-center gap-2 group hover:-translate-y-0.5 active:translate-y-0"
                >
                    <span>Sign In & Unlock AI Core</span>
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>
        {% endif %}

    </div>
</div>

<!-- DYNAMIC CIRCULAR NEURAL NETWORK PARTICLE CANVAS (Inspired by User's Circular & Network Images) -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("neural-network-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        });

        // Mouse tracking for dynamic interactive sway
        const mouse = { x: width / 2, y: height / 2, radius: 220 };
        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Generate circular constellation nodes orbiting cleanly around the center form
        const nodeCount = 110;
        let nodes = [];

        function initNodes() {
            nodes = [];
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0; i < nodeCount; i++) {
                const angle = (i / nodeCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
                // Leave the center clear (radius 220 to 450) where the sign in inputs sit
                const ringRadius = 220 + Math.random() * 260;
                const x = centerX + Math.cos(angle) * ringRadius;
                const y = centerY + Math.sin(angle) * (ringRadius * 0.88);

                // Gradient palette matching user's reference: Cyan, Indigo, Purple, Pink, Rose
                const colorRatio = i / nodeCount;
                let color;
                if (colorRatio < 0.25) color = "rgba(56, 189, 248, "; // Cyan
                else if (colorRatio < 0.5) color = "rgba(129, 140, 248, "; // Indigo
                else if (colorRatio < 0.75) color = "rgba(168, 85, 247, "; // Purple
                else color = "rgba(244, 114, 182, "; // Pink

                nodes.push({
                    baseX: x,
                    baseY: y,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    radius: 2.2 + Math.random() * 3.5,
                    color: color,
                    pulsePhase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03
                });
            }
        }

        initNodes();

        // Pulses traveling across lines
        const pulses = [];
        function createPulse(n1, n2) {
            pulses.push({
                x1: n1.x,
                y1: n1.y,
                x2: n2.x,
                y2: n2.y,
                progress: 0,
                speed: 0.015 + Math.random() * 0.02
            });
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw connecting lines between nearby nodes
            const maxDist = 95;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.45;
                        ctx.strokeStyle = `rgba(147, 130, 247, ${alpha})`;
                        ctx.lineWidth = 1.0;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();

                        if (Math.random() < 0.0004 && pulses.length < 25) {
                            createPulse(nodes[i], nodes[j]);
                        }
                    }
                }
            }

            // Draw pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.progress += p.speed;
                if (p.progress >= 1) {
                    pulses.splice(i, 1);
                    continue;
                }
                const px = p.x1 + (p.x2 - p.x1) * p.progress;
                const py = p.y1 + (p.y2 - p.y1) * p.progress;

                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.arc(px, py, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw and update each node
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];

                n.x += n.vx;
                n.y += n.vy;

                // Restoring force to keep circular shape
                n.x += (n.baseX - n.x) * 0.02;
                n.y += (n.baseY - n.y) * 0.02;

                // Mouse interaction
                const dxMouse = mouse.x - n.x;
                const dyMouse = mouse.y - n.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                if (distMouse < mouse.radius) {
                    const force = (1 - distMouse / mouse.radius) * 1.5;
                    n.x -= (dxMouse / distMouse) * force * 15;
                    n.y -= (dyMouse / distMouse) * force * 15;
                }

                // Breathing pulse
                n.pulsePhase += n.pulseSpeed;
                const currentRadius = n.radius + Math.sin(n.pulsePhase) * 1.2;
                const currentAlpha = 0.65 + Math.sin(n.pulsePhase) * 0.35;

                // Outer Glow
                ctx.fillStyle = n.color + (currentAlpha * 0.25) + ")";
                ctx.beginPath();
                ctx.arc(n.x, n.y, currentRadius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Core Node
                ctx.fillStyle = n.color + currentAlpha + ")";
                ctx.beginPath();
                ctx.arc(n.x, n.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
{% endblock %}
