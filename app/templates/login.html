{% extends "base.html" %}

{% block title %}Sign In — Metricore.in{% endblock %}

{% block content %}
<div class="relative w-full min-h-[calc(100vh-8rem)] flex items-center justify-center p-4 sm:p-6 overflow-hidden bg-slate-950 select-none">

    <!-- Ambient Breathing Center Aura -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-purple-600/10 rounded-full blur-[160px] pointer-events-none animate-breathe"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[140px] pointer-events-none animate-breathe-glow"></div>

    <!-- UNIFORM CIRCULAR NEURAL NETWORK CANVAS (Encircles the Sign In Form) -->
    <canvas id="neural-network-canvas" class="absolute inset-0 w-full h-full pointer-events-auto z-0 opacity-95"></canvas>

    <!-- UN-ENCLOSED SIGN IN CONTAINER (Centered inside the Uniform Circular Halo) -->
    <div id="node-signin" class="relative z-20 w-full max-w-[340px] p-6 text-center">

        {% if is_authenticated %}
            <!-- Authenticated State -->
            <div class="space-y-4">
                <div class="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/20 backdrop-blur-md">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black text-white drop-shadow-md">Signed In as Akbar</h3>
                    <p class="text-xs text-slate-400 mt-1">AI Core ecosystem is unlocked.</p>
                </div>
                <div class="pt-2 flex flex-col gap-2.5">
                    <a href="/" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white text-xs font-bold uppercase tracking-wider shadow-xl shadow-purple-600/30 transition-all text-center block">
                        Enter Dashboard →
                    </a>
                    <a href="/logout" class="w-full py-2.5 rounded-2xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 text-xs font-medium text-center block border border-slate-800 backdrop-blur-md">
                        Sign Out
                    </a>
                </div>
            </div>
        {% else %}
            <!-- Seamless Sign In Form -->
            <form method="POST" action="/login" class="space-y-4 text-left">
                {% if error %}
                    <div class="p-3 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2 backdrop-blur-md">
                        <svg class="w-4 h-4 text-rose-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5 drop-shadow">
                        Admin Username
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            value="{{ entered_username or default_user }}" 
                            required 
                            autocomplete="username"
                            placeholder="Username (Akbar)"
                            class="w-full px-4 py-3 rounded-2xl bg-slate-950/85 border border-slate-800/90 text-white text-xs focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 backdrop-blur-xl transition-all font-medium shadow-xl"
                        >
                        <span class="absolute right-3.5 top-3.5 text-[9px] text-purple-400 font-mono font-bold">ADMIN</span>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5 drop-shadow">
                        Admin Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        value="REDACTED"
                        required 
                        autocomplete="current-password"
                        placeholder="Password (unlock)"
                        class="w-full px-4 py-3 rounded-2xl bg-slate-950/85 border border-slate-800/90 text-white text-xs focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 backdrop-blur-xl transition-all font-medium shadow-xl"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-600 via-purple-600 to-pink-600 hover:from-cyan-500 hover:via-purple-500 hover:to-pink-500 text-white text-xs font-bold uppercase tracking-wider shadow-2xl shadow-purple-600/30 transition-all flex items-center justify-center gap-2 group hover:-translate-y-0.5 active:translate-y-0"
                >
                    <span>Sign In & Unlock AI Core</span>
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>
        {% endif %}

    </div>
</div>

<!-- UNIFORM CIRCULAR NEURAL NETWORK ENGINE (True Geometric Ring Architecture) -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("neural-network-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCircularNodes();
        });

        // Mouse tracking for interactive breathing
        const mouse = { x: width / 2, y: height / 2, radius: 240 };
        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Generate Uniform Concentric Circular Rings of Nodes
        let nodes = [];
        const ringConfigs = [
            { radiusOffset: 255, count: 32, jitter: 12 }, // Inner clear boundary (safe breathing distance from form)
            { radiusOffset: 295, count: 36, jitter: 15 }, // Mid-inner ring
            { radiusOffset: 340, count: 42, jitter: 18 }, // Mid-outer ring
            { radiusOffset: 385, count: 48, jitter: 20 }  // Outer halo ring
        ];

        function initCircularNodes() {
            nodes = [];
            const centerX = width / 2;
            const centerY = height / 2;

            // Responsive radius scale: scales down gracefully on small mobile screens
            const scale = Math.min(1, Math.max(0.65, width / 1100));

            ringConfigs.forEach((ring, ringIdx) => {
                const baseRadius = ring.radiusOffset * scale;
                const count = Math.round(ring.count * (width < 640 ? 0.65 : 1));

                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    // Controlled jitter to maintain uniform circular shape with organic geometric mesh
                    const r = baseRadius + (Math.random() - 0.5) * ring.jitter * scale;
                    const jitterAngle = angle + (Math.random() - 0.5) * 0.08;

                    const x = centerX + Math.cos(jitterAngle) * r;
                    const y = centerY + Math.sin(jitterAngle) * r;

                    // Color palette according to angular sector (Cyan -> Indigo -> Purple -> Pink -> Rose)
                    const colorAngleRatio = (angle / (Math.PI * 2));
                    let color;
                    if (colorAngleRatio < 0.25) color = "rgba(56, 189, 248, "; // Electric Cyan
                    else if (colorAngleRatio < 0.50) color = "rgba(99, 102, 241, "; // Indigo
                    else if (colorAngleRatio < 0.75) color = "rgba(168, 85, 247, "; // Vivid Purple
                    else color = "rgba(236, 72, 153, "; // Pink / Rose

                    nodes.push({
                        baseX: x,
                        baseY: y,
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        radius: 2.2 + Math.random() * 2.8,
                        color: color,
                        ringIdx: ringIdx,
                        angle: angle,
                        pulsePhase: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.02 + Math.random() * 0.025
                    });
                }
            });
        }

        initCircularNodes();

        // Traveling Light Pulses along the circular mesh
        const pulses = [];
        function createPulse(n1, n2) {
            pulses.push({
                x1: n1.x,
                y1: n1.y,
                x2: n2.x,
                y2: n2.y,
                progress: 0,
                speed: 0.018 + Math.random() * 0.02
            });
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Connect adjacent nodes to form uniform circular geometric mesh
            const maxConnectDist = 65 * Math.min(1, Math.max(0.7, width / 1100));

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxConnectDist) {
                        const alpha = (1 - dist / maxConnectDist) * 0.5;
                        ctx.strokeStyle = `rgba(139, 92, 246, ${alpha})`;
                        ctx.lineWidth = 1.0;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();

                        // Periodic traveling pulses
                        if (Math.random() < 0.0003 && pulses.length < 24) {
                            createPulse(nodes[i], nodes[j]);
                        }
                    }
                }
            }

            // Draw traveling pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.progress += p.speed;
                if (p.progress >= 1) {
                    pulses.splice(i, 1);
                    continue;
                }
                const px = p.x1 + (p.x2 - p.x1) * p.progress;
                const py = p.y1 + (p.y2 - p.y1) * p.progress;

                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.arc(px, py, 2.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw and update each node in the ring
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];

                // Gentle organic drift
                n.x += n.vx;
                n.y += n.vy;

                // Strong restoring force to maintain the perfect circular geometry
                n.x += (n.baseX - n.x) * 0.035;
                n.y += (n.baseY - n.y) * 0.035;

                // Interactive mouse repulsion/deflection
                const dxMouse = mouse.x - n.x;
                const dyMouse = mouse.y - n.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                if (distMouse < mouse.radius) {
                    const force = (1 - distMouse / mouse.radius) * 1.8;
                    n.x -= (dxMouse / distMouse) * force * 12;
                    n.y -= (dyMouse / distMouse) * force * 12;
                }

                // Breathing pulse animation
                n.pulsePhase += n.pulseSpeed;
                const currentRadius = n.radius + Math.sin(n.pulsePhase) * 1.0;
                const currentAlpha = 0.7 + Math.sin(n.pulsePhase) * 0.3;

                // Outer Node Glow Halo
                ctx.fillStyle = n.color + (currentAlpha * 0.25) + ")";
                ctx.beginPath();
                ctx.arc(n.x, n.y, currentRadius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Core Node Point
                ctx.fillStyle = n.color + currentAlpha + ")";
                ctx.beginPath();
                ctx.arc(n.x, n.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
{% endblock %}
