{% extends "base.html" %}

{% block title %}Page Not Found (404) — Metricore.in{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full text-center space-y-6 p-8 rounded-3xl bg-slate-900/80 border border-slate-800 shadow-2xl backdrop-blur-xl">
        <div class="w-16 h-16 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 text-3xl font-black flex items-center justify-center mx-auto shadow-inner">
            404
        </div>
        
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-white tracking-tight">Page Not Found</h1>
            <p class="text-xs text-slate-400 leading-relaxed">
                The page or resource you requested does not exist or has been moved.
            </p>
        </div>

        <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a 
                href="/" 
                class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold shadow-lg shadow-purple-600/30 transition-all flex items-center justify-center gap-2 min-h-[44px]"
            >
                <span>Return Home</span>
                <span>→</span>
            </a>
            <a 
                href="/ai-tools/" 
                class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition-all flex items-center justify-center min-h-[44px]"
            >
                Browse AI Tools
            </a>
        </div>
    </div>
</div>
{% endblock %}
